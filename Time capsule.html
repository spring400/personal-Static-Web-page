<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放页面</title>
    <style>
        /* 全局样式：深色背景，居中布局，适合PC观看 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .video-container {
            background-color: #000;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            max-width: 960px;  /* 适合PC的宽度 */
            width: 90%;
            margin: 20px;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 80vh;   /* 防止视频过高 */
            background-color: #000;
        }

        /* 简单的提示文字（可选） */
        .video-info {
            padding: 16px 20px;
            background-color: #222;
            color: #ccc;
            font-size: 14px;
            border-top: 1px solid #333;
        }

        .video-info p {
            margin: 4px 0;
        }

        .video-info .filename {
            color: #fff;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- 
            ★ 重要：请将 href 和 src 中的 "your-video-file.mp4" 替换为您实际视频文件的路径/文件名。
            支持常见格式：.mp4, .webm, .ogg 等。
            如果视频文件与 HTML 在同一文件夹，直接写文件名即可。
        -->
        <video controls autoplay muted loop>
            <!-- 主视频源（推荐 MP4，兼容性最好） -->
            <source src="your-video-file.mp4" type="video/mp4">
            <!-- 备选格式（可选，用于兼容老旧浏览器） -->
            <source src="your-video-file.webm" type="video/webm">
            <source src="your-video-file.ogv" type="video/ogg">
            <!-- 如果浏览器都不支持，显示此文字 -->
            您的浏览器不支持视频播放，请尝试使用 Chrome、Edge 或 Firefox 等现代浏览器。
        </video>

        <!-- 视频信息区域（可自行修改或删除） -->
        <div class="video-info">
            <p>📁 当前视频文件：<span class="filename">your-video-file.mp4</span></p>
            <p>💡 提示：将视频文件放在本 HTML 同目录下，并修改上方 <code>&lt;source&gt;</code> 标签中的文件名即可。</p>
        </div>
    </div>
</body>
</html>
